openapi: 3.0.3
info:
  title: Pomiary Wysiłkowe – API
  version: 1.0.0
  license:
    name: ISC
  description: |
    REST API aplikacji do monitorowania obciążenia i gotowości zawodnika.
    Baza: SQL Server (`PomiaryDB`). Uwierzytelnianie: brak – użytkownik identyfikowany pseudonimem.

    **Zasady:**
    - jeden wpis na użytkownika dziennie – ponowny zapis w tym samym dniu nadpisuje wpis,
    - obciążenia (sRPE) liczy baza: czas × RPE, osobno dla treningu i pracy,
    - wpis może usunąć jego właściciel albo admin (wuefista).
# API nie ma uwierzytelniania - jawnie: brak wymagań bezpieczeństwa
security: []
servers:
  - url: /api
    description: ten sam serwer
tags:
  - name: Komórki
    description: Komórki organizacyjne i osoby w nich
  - name: Użytkownicy
    description: Logowanie pseudonimem i dane użytkownika
  - name: Pomiary
    description: 'Wpisy dzienne: obciążenie, regeneracja, gotowość'

paths:
  /komorki:
    get:
      tags: [Komórki]
      summary: Lista komórek organizacyjnych
      description: Posortowana alfabetycznie, z liczbą osób (rola `user`) w każdej komórce.
      operationId: getKomorki
      responses:
        '200':
          description: Lista komórek
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Komorka' }

  /komorki/{id}/uzytkownicy:
    get:
      tags: [Komórki]
      summary: Osoby w komórce (panel admina)
      description: Użytkownicy z rolą `user` w danej komórce, z liczbą pomiarów i datą ostatniego.
      operationId: getOsobyWKomorce
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lista osób
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OsobaWKomorce' }

  /login:
    post:
      tags: [Użytkownicy]
      summary: Logowanie pseudonimem
      description: |
        Zwraca użytkownika o podanym pseudonimie. Jeśli nie istnieje – tworzy go z rolą `user`
        w podanej komórce. Dla istniejących użytkowników (także admina) `komorkaId` jest ignorowane.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Logowanie' }
            examples:
              nowy:
                summary: Nowy użytkownik
                value: { pseudonim: kowal, komorkaId: 1 }
              admin:
                summary: Wuefista
                value: { pseudonim: wuefista }
      responses:
        '200':
          description: Zalogowany (lub utworzony) użytkownik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Uzytkownik' }
        '400': { $ref: '#/components/responses/Blad400' }

  /uzytkownicy/{id}:
    get:
      tags: [Użytkownicy]
      summary: Dane użytkownika
      operationId: getUzytkownik
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Użytkownik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Uzytkownik' }
        '404': { $ref: '#/components/responses/Blad404' }

  /pomiary:
    post:
      tags: [Pomiary]
      summary: Zapis dzisiejszego pomiaru
      description: |
        Jeden pomiar dziennie: jeśli użytkownik ma już dziś pomiar, zostaje on **nadpisany**
        (pole `Nadpisany: true`), w przeciwnym razie tworzony jest nowy.
        Wymagane jest co najmniej jedno pole pomiarowe; puste pola zapisywane są jako `null`.
      operationId: zapiszPomiar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NowyPomiar' }
      responses:
        '200':
          description: Zapisany pomiar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PomiarZapisany' }
        '400': { $ref: '#/components/responses/Blad400' }

  /pomiary/{id}:
    get:
      tags: [Pomiary]
      summary: Pomiary użytkownika
      description: Wszystkie pomiary użytkownika posortowane rosnąco po dacie.
      operationId: getPomiary
      parameters:
        - name: id
          in: path
          required: true
          description: Id **użytkownika**
          schema: { type: integer, example: 5 }
      responses:
        '200':
          description: Lista pomiarów
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pomiar' }
    delete:
      tags: [Pomiary]
      summary: Usunięcie pomiaru
      description: Usunąć może właściciel pomiaru albo użytkownik z rolą `admin`.
      operationId: usunPomiar
      parameters:
        - name: id
          in: path
          required: true
          description: Id **pomiaru**
          schema: { type: integer, example: 120 }
        - name: uzytkownikId
          in: query
          required: true
          description: Id osoby, która usuwa pomiar
          schema: { type: integer, example: 5 }
      responses:
        '200':
          description: Usunięto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/Blad400' }
        '403': { $ref: '#/components/responses/Blad403' }
        '404': { $ref: '#/components/responses/Blad404' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }

  responses:
    Blad400:
      description: Błędne dane (np. wartość spoza zakresu)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Blad' }
          example: { error: 'RPE treningu: dozwolony zakres 0–10.' }
    Blad403:
      description: Brak uprawnień
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Blad' }
          example: { error: Możesz usuwać tylko swoje pomiary. }
    Blad404:
      description: Nie znaleziono
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Blad' }
          example: { error: Nie ma takiego pomiaru. }

  schemas:
    Blad:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Komorka:
      type: object
      properties:
        Id: { type: integer, example: 1 }
        Nazwa: { type: string, example: Pluton 1 }
        LiczbaOsob: { type: integer, example: 2 }

    Rola:
      type: string
      enum: [user, admin]

    Uzytkownik:
      type: object
      properties:
        Id: { type: integer, example: 5 }
        Pseudonim: { type: string, maxLength: 50, example: kowal }
        KomorkaId: { type: integer, nullable: true, example: 1 }
        Rola: { $ref: '#/components/schemas/Rola' }
        KomorkaNazwa:
          type: string
          nullable: true
          description: Tylko w `GET /uzytkownicy/{id}`
          example: Pluton 1

    OsobaWKomorce:
      allOf:
        - $ref: '#/components/schemas/Uzytkownik'
        - type: object
          properties:
            LiczbaPomiarow: { type: integer, example: 17 }
            OstatniPomiar: { type: string, format: date-time, nullable: true }

    Logowanie:
      type: object
      required: [pseudonim]
      properties:
        pseudonim: { type: string, minLength: 1, maxLength: 50 }
        komorkaId:
          type: integer
          nullable: true
          description: Wymagane tylko przy tworzeniu nowego użytkownika

    Pomiar:
      type: object
      properties:
        Id: { type: integer, example: 120 }
        UzytkownikId: { type: integer, example: 5 }
        Data: { type: string, format: date-time }
        CzasTreningu: { type: integer, nullable: true, example: 75, description: minuty }
        RpeTreningu: { type: integer, nullable: true, example: 7, description: skala Borga CR-10 (0-10) }
        CzasPracy: { type: integer, nullable: true, example: 480, description: minuty }
        RpePracy: { type: integer, nullable: true, example: 3, description: skala Borga CR-10 (0-10) }
        TetnoPoranne: { type: integer, nullable: true, example: 54, description: 'ud./min, pomiar po przebudzeniu' }
        Sen: { type: number, format: float, nullable: true, example: 7.25, description: 'godziny, krok 0,25' }
        ChecDoTreningu: { type: integer, nullable: true, example: 4, description: 1-5 (buźki) }
        Tapping: { type: integer, nullable: true, example: 42, description: stuknięcia w 10 s }
        ObciazenieTreningowe:
          type: integer
          nullable: true
          readOnly: true
          example: 525
          description: 'sRPE: CzasTreningu × RpeTreningu [AU]; NULL, gdy brakuje składnika'
        ObciazeniePraca:
          type: integer
          nullable: true
          readOnly: true
          example: 1440
          description: 'sRPE: CzasPracy × RpePracy [AU]; NULL, gdy brakuje składnika'

    PomiarZapisany:
      allOf:
        - $ref: '#/components/schemas/Pomiar'
        - type: object
          properties:
            Nadpisany:
              type: boolean
              description: '`true` – nadpisano dzisiejszy pomiar, `false` – utworzono nowy'

    NowyPomiar:
      type: object
      required: [uzytkownikId]
      description: |
        Pola są opcjonalne (`null` = brak), ale co najmniej jedno musi być podane.
        Czasy podaje się **w minutach**. Suma `czasTreningu` i `czasPracy` nie może przekroczyć 1440 min (24 h).
        Obciążeń (sRPE) nie wysyła się - liczy je baza.
      properties:
        uzytkownikId: { type: integer, example: 5 }
        czasTreningu: { type: integer, nullable: true, minimum: 0, maximum: 1440, example: 75 }
        rpeTreningu: { type: integer, nullable: true, minimum: 0, maximum: 10, example: 7 }
        czasPracy: { type: integer, nullable: true, minimum: 0, maximum: 1440, example: 480 }
        rpePracy: { type: integer, nullable: true, minimum: 0, maximum: 10, example: 3 }
        tetnoPoranne: { type: integer, nullable: true, minimum: 20, maximum: 120, example: 54 }
        sen:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 12
          multipleOf: 0.25
          example: 7.25
        checDoTreningu: { type: integer, nullable: true, minimum: 1, maximum: 5, example: 4 }
        tapping: { type: integer, nullable: true, minimum: 0, maximum: 500, example: 42 }
